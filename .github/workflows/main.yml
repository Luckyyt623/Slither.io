name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - name: Create full Flutter project
        run: |
          flutter create --project-name slither_browser tmp_app
          cp slither_app/lib/main.dart tmp_app/lib/main.dart
          cp slither_app/pubspec.yaml tmp_app/pubspec.yaml
      - name: Build APK
        working-directory: tmp_app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: slither-apk
          path: tmp_app/build/app/outputs/flutter-apk/app-release.apk
